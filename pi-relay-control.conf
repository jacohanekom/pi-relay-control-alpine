# pi-relay-control configuration
# Changes take effect after: sudo rc-service pi-relay-control restart

# One line per relay: relay <gpio_pin> <port>
#   gpio_pin: BCM GPIO number
#   port:     TCP port for nc control, must be unique per relay
#
# Each relay is controlled independently over its own port:
#   echo "on"     | nc localhost 7778
#   echo "off"    | nc localhost 7778
#   echo "status" | nc localhost 7778
#
# IO21 on DFRobot GPIO Screw HAT = BCM 5
relay 5 7778

# Add more lines for additional relays, e.g.:
# relay 6 7779
