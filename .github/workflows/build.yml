name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Genuinely aarch64 hardware (no QEMU) -- Pi 3 is a 64-bit-capable
    # (Cortex-A53) board and Alpine's rpi images target aarch64, so this
    # matches the actual deploy target and keeps the container build a
    # native compile rather than an emulated cross-build.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # liblgpio isn't packaged for Alpine, so it's built from source
      # inside the same Alpine container used to build relay_control,
      # guaranteeing both are linked against the same musl libc. The
      # unversioned dev symlink (liblgpio.so) is only needed to link;
      # what ships is the real liblgpio.so.1 the binary's SONAME points
      # at, since Alpine has no equivalent apk package to depend on.
      - name: Build in Alpine container
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base git linux-headers

            # musl has no dynamic-linker cache, so Alpine ships no ldconfig,
            # but lg'\''s install target calls it unconditionally. Shim it as
            # a no-op rather than patching lg'\''s Makefile.
            printf "#!/bin/sh\n" > /usr/local/bin/ldconfig
            chmod +x /usr/local/bin/ldconfig

            git clone --depth 1 https://github.com/joan2937/lg /tmp/lg
            make -C /tmp/lg
            make -C /tmp/lg install

            make

            mkdir -p dist
            cp relay_control dist/
            cp /usr/local/lib/liblgpio.so.1 dist/
            cp pi-relay-control.conf dist/
            cp openrc/pi-relay-control.initd dist/
          '

      - name: Package artifact
        run: |
          mkdir -p pi-relay-control-alpine-aarch64
          cp dist/* pi-relay-control-alpine-aarch64/
          tar czf pi-relay-control-alpine-aarch64.tar.gz pi-relay-control-alpine-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: pi-relay-control-alpine-aarch64
          path: pi-relay-control-alpine-aarch64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-relay-control-alpine-aarch64.tar.gz
