name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Genuinely aarch64 hardware (no QEMU) -- Pi 3 is a 64-bit-capable
    # (Cortex-A53) board and Alpine's rpi images target aarch64, so this
    # matches the actual deploy target and keeps the container build a
    # native compile rather than an emulated cross-build.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # liblgpio isn't packaged for Alpine, so it's built from source
      # inside the same Alpine container used to build relay_control,
      # guaranteeing both are linked against the same musl libc. The
      # unversioned dev symlink (liblgpio.so) is only needed to link;
      # what ships is the real liblgpio.so.1 the binary's SONAME points
      # at, since Alpine has no equivalent apk package to depend on.
      - name: Build in Alpine container
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base git linux-headers

            # musl has no dynamic-linker cache, so Alpine ships no ldconfig,
            # but lg'\''s install target calls it unconditionally. Shim it as
            # a no-op rather than patching lg'\''s Makefile.
            printf "#!/bin/sh\n" > /usr/local/bin/ldconfig
            chmod +x /usr/local/bin/ldconfig

            git clone --depth 1 https://github.com/joan2937/lg /tmp/lg
            make -C /tmp/lg
            make -C /tmp/lg install

            make

            mkdir -p dist
            cp relay_control dist/
            cp /usr/local/lib/liblgpio.so.1 dist/
            cp pi-relay-control.conf dist/
            cp openrc/pi-relay-control.initd dist/
          '

      - name: Package artifact
        run: |
          mkdir -p pi-relay-control-alpine-aarch64
          cp dist/* pi-relay-control-alpine-aarch64/
          tar czf pi-relay-control-alpine-aarch64.tar.gz pi-relay-control-alpine-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: pi-relay-control-alpine-aarch64
          path: pi-relay-control-alpine-aarch64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-relay-control-alpine-aarch64.tar.gz

  apk:
    # Builds an actual installable .apk (via abuild, alpine/APKBUILD) so
    # it can go straight on a device with `apk add --allow-untrusted
    # pi-relay-control-*.apk`, no repo/network needed at install time.
    # The signing key generated below is throwaway/per-run -- it exists
    # only so abuild has something to sign with, not to establish trust
    # for a distributed repo, hence --allow-untrusted on install.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build .apk in Alpine container
        run: |
          mkdir -p apk-dist apk-home
          docker run --rm -v "$PWD":/work -w /work/alpine \
            -e HOME=/work/apk-home -e REPODEST=/work/apk-dist \
            alpine:3.20 sh -c '
              set -e
              # abuild-keygen -i (installs the pubkey to /etc/apk/keys) and
              # abuild'\''s makedepends install both shell out to doas
              # directly -- alpine-sdk'\''s abuild-sudo group trick alone
              # does not cover this. doas.conf must be at /etc/doas.conf
              # (not /etc/doas.d/) and use "nopass" (doas syntax, not
              # sudo'\''s "nopasswd").
              apk add --no-cache alpine-sdk doas
              echo "permit nopass builder" > /etc/doas.conf
              chmod 0400 /etc/doas.conf

              adduser -D builder
              addgroup builder abuild
              mkdir -p "$HOME"
              chown -R builder:builder /work

              su builder -c "
                set -e
                abuild-keygen -a -i -n
                cd /work/alpine
                abuild checksum
                abuild -r
              "
            '

      - name: Collect .apk artifact
        run: |
          APK_PATH="$(find apk-dist -name '*.apk' | head -n1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" pi-relay-control-aarch64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pi-relay-control-apk-aarch64
          path: pi-relay-control-aarch64.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-relay-control-aarch64.apk
